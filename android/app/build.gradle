plugins {
  id 'com.android.application'
  id 'kotlin-android'
  id 'kotlin-kapt'
}

kotlin {
  kotlinDaemonJvmArgs = [
    "-Dfile.encoding=UTF-8",
    "--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED",
    "--add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED"
  ]

  jvmToolchain(21)

}

// Loads release signing config from keystore.properties (gitignored). See
// keystore.properties.example for the expected keys.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
  keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def allowUnsignedReleaseVerification =
  providers.gradleProperty("allowUnsignedReleaseVerification").orNull == "true"

gradle.taskGraph.whenReady { graph ->
  def createsReleaseArtifact = graph.allTasks.any { task ->
    task.project == project && task.name in ["assembleRelease", "bundleRelease", "packageRelease"]
  }
  if (createsReleaseArtifact && !keystorePropertiesFile.exists() &&
      !allowUnsignedReleaseVerification) {
    throw new GradleException(
      "Release signing is not configured. Supply android/keystore.properties, " +
      "or use -PallowUnsignedReleaseVerification=true only for a deliberately unsigned CI check."
    )
  }
}

android {
  namespace 'com.audiobookshelf.app'
  sourceSets {
    main {
      // This dedicated AAOS artifact has no WebView/MainActivity. Do not ship
      // the dormant Nuxt phone UI (including third-party web dependencies and
      // legacy branding) when only the native media service/settings surface
      // is reachable.
      // An exclude pattern is not honored by AGP's merged-assets pipeline for
      // a generated Capacitor directory. Remove the app asset source set
      // entirely; native ShelfDrive code has no AssetManager dependency.
      assets.srcDirs = []
    }
  }
  buildFeatures {
    viewBinding true
    buildConfig true
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_21
    targetCompatibility JavaVersion.VERSION_21
  }
  kotlinOptions {
    freeCompilerArgs = ['-Xjvm-default=all']
    jvmTarget = '21'
  }
  testOptions {
    unitTests.includeAndroidResources = true
    unitTests.all {
      // Paper's collection serializers use reflection when running on the JVM.
      jvmArgs '--add-opens=java.base/java.util=ALL-UNNAMED'
      // The current Capacitor artifacts include Java 21 bytecode; Robolectric
      // tests that exercise JSObject must therefore run on a Java 21 launcher.
      javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
      }
    }
  }
  compileSdk rootProject.ext.compileSdkVersion
  defaultConfig {
    applicationId "com.jedibk.shelfdrive"
    minSdkVersion rootProject.ext.minSdkVersion
    targetSdkVersion rootProject.ext.targetSdkVersion
    // Version 129 was rejected by Play; v131 adds release-safe AAOS offline downloads.
    versionCode 131
    versionName "0.1"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    manifestPlaceholders = [
      "appAuthRedirectScheme": "com.jedibk.shelfdrive"
    ]
    aaptOptions {
      // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
      // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
      ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
  }
  signingConfigs {
    release {
      // CI may deliberately verify an unsigned bundle only through the
      // explicit property above; local release artifacts are signed by default.
      if (keystorePropertiesFile.exists()) {
        storeFile rootProject.file(keystoreProperties['storeFile'])
        storePassword keystoreProperties['storePassword']
        keyAlias keystoreProperties['keyAlias']
        keyPassword keystoreProperties['keyPassword']
      }
    }
  }
  buildTypes {
    debug {
      applicationIdSuffix ".debug"
      versionNameSuffix "-debug"
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
    release {
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
      if (keystorePropertiesFile.exists()) {
        signingConfig signingConfigs.release
      }
    }
  }
}

configurations.configureEach {
  resolutionStrategy {
    force("com.google.android.gms:play-services-base:18.0.1")
    force("androidx.appcompat:appcompat:$androidxAppCompatVersion")
    force("androidx.core:core-ktx:$androidx_core_ktx_version")
    force("androidx.media:media:$androidx_media_version")
    force("org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlin_coroutines_version")
    force("org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlin_coroutines_version")
  }
}

dependencies {
  implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
  implementation fileTree(include: ['*.jar'], dir: 'libs')
  implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
  // Capacitor is debug-only. The dedicated AAOS release source set excludes
  // every phone bridge source and has no runtime or compile dependency on it.
  if (findProject(':capacitor-android') != null) {
    debugImplementation project(':capacitor-android')
  }

  implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
  implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"

  implementation "androidx.core:core-ktx:$androidx_core_ktx_version"

  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlin_coroutines_version"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlin_coroutines_version"

  implementation "androidx.media:media:$androidx_media_version"

  // Exo Player
  if (findProject(':exoplayer-library-core') != null) {
    implementation project(':exoplayer-library-core')
    implementation project(':exoplayer-library-ui')
    implementation project(':exoplayer-extension-mediasession')
    implementation project(':exoplayer-hls')
  } else {
    implementation "com.google.android.exoplayer:exoplayer-core:$exoplayer_version"
    implementation "com.google.android.exoplayer:exoplayer-ui:$exoplayer_version"
    implementation "com.google.android.exoplayer:extension-mediasession:$exoplayer_version"
    implementation "com.google.android.exoplayer:exoplayer-hls:$exoplayer_version"
  }
  implementation "com.google.android.exoplayer:extension-okhttp:$exoplayer_version"

  // ExoPlayer 2.x resolves an older Guava. Keep the Android variant on the
  // first patched line that clears its known temporary-file advisories.
  implementation 'com.google.guava:guava:32.1.3-android'

  // Glide for images
  implementation "com.github.bumptech.glide:glide:$glide_version"

  // Paper NoSQL Db
  implementation 'io.github.pilgr:paperdb:2.7.2'

  // Simple Storage
  implementation "com.anggrayudi:storage:1.5.6"

  // OK HTTP
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'

  // Jackson for JSON
  implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.21.5'

  // Material Components for AAOS-friendly settings UI (switches, dropdowns, etc.)
  implementation 'com.google.android.material:material:1.12.0'

  testImplementation "junit:junit:$junitVersion"
  testImplementation 'org.robolectric:robolectric:4.14.1'
  testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
  testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
}
