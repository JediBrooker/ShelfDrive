plugins {
  id("org.gradle.toolchains.foojay-resolver-convention") version "0.9.0"
}

include ':app'

// The Play artifact is native AAOS-only and has no Capacitor dependency.
// Keep the generated Capacitor project available for local debug builds when
// npm dependencies are installed, but let release verification run from a
// clean checkout with only the Android/JDK toolchain.
if (file('../node_modules/@capacitor/android/capacitor').isDirectory()) {
  apply from: 'capacitor.settings.gradle'
}
